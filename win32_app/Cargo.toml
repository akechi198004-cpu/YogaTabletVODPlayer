[package]
name = "hm-video-win32"
version = "0.1.0"
edition = "2021"
description = "HM影视 Windows 桌面版：星帆影视浏览、搜索与外部 VLC 播放"

[dependencies]
directories = "5.0"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.27"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "rustls-tls"] }
scraper = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
url = "2.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
